<!doctype html>
<html>
  <head><meta charset="utf-8"><title>step probe</title></head>
  <body>
    <pre id="out">idle</pre>
    <script type="module">
      const out = document.getElementById('out')
      const lines = []
      function flush() { out.textContent = lines.join('\n') }
      flush()
      try {
        const mod = await import('/src/lib/near.ts')
        lines.push('1. near.ts ok')
        flush()
        const runtime = await mod.loadNearRuntime()
        lines.push('2. runtime=' + (runtime ? 'loaded (wallet=' + runtime.walletLibraryAvailable + ')' : 'null'))
        flush()
        const st = await runtime.view('isa01.derelict-factory.testnet', 'get_state', {})
        lines.push('3. get_state ok: ' + JSON.stringify({ owner: st.owner, turn: st.turn, operating: st.operating }))
        flush()
      } catch (e) {
        lines.push('FAIL: ' + String(e))
        lines.push('windowErr: ' + JSON.stringify((window).__derelictRpcErrors ?? []))
        flush()
      }
    </script>
  </body>
</html>
